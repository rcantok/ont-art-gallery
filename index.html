<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ONT Art Gallery — Osman Nihat Tok</title>
  <meta name="description" content="Ressam Osman Nihat Tok'un orijinal eserleri.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Bodoni+Moda:opsz,wght@6..96,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Tasarım: Claude Design şablonundan uyarlandı (yeni tasarim.html) */
    :root { --accent: #4E5B3C; --ink: #161616; --muted: #4a4a4a; --matte: #e9e6e0; --line: #e4e2dd; --soft: #f3f2ef; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #fff; color: var(--ink); font-family: 'Manrope', system-ui, sans-serif; }
    a { color: var(--ink); text-decoration: none; }
    a:hover { color: #3B4630; }
    h1, h2, h3 { font-family: 'Archivo', sans-serif; }
    .wrap { max-width: 1120px; margin: 0 auto; }
    .wide { max-width: 1240px; margin: 0 auto; }
    .h2 { margin: 0; font-weight: 800; font-size: clamp(30px, 3.4vw, 44px); letter-spacing: -.01em; }
    .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .3em; text-transform: uppercase; }
    :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

    /* Üst menü — ana sayfada hero'nun üstünde, diğer sayfalarda sabit */
    .site-header { position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,.86); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid rgba(22,22,22,.08); }
    .is-home .site-header { position: absolute; left: 0; right: 0; background: rgba(255,255,255,.72); }
    .site-header .wide { padding: 10px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 32px; }
    .logo { display: flex; flex-direction: column; align-items: center; line-height: 1; padding: 6px 0; }
    .logo b { font-family: 'Bodoni Moda', Georgia, serif; font-weight: 500; font-size: 24px; letter-spacing: .22em; text-transform: uppercase; }
    .logo small { font-size: 10px; font-weight: 600; letter-spacing: .42em; text-transform: uppercase; margin-top: 6px; color: var(--muted); }
    .site-header nav { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 28px; font-size: 14px; font-weight: 700; }
    .site-header nav a { padding: 12px 2px; display: inline-flex; align-items: center; gap: 6px; }
    .site-header nav a[aria-current="page"] { color: var(--accent); }
    .icon-link { position: relative; min-width: 44px; justify-content: center; }
    .icon-link svg { width: 22px; height: 22px; }
    .badge { position: absolute; top: 4px; right: -4px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 99px; background: var(--accent); color: #fff; font-size: 11px; line-height: 18px; text-align: center; }

    /* Hero */
    .hero { position: relative; height: 620px; overflow: hidden; background: #2a1a12; }
    .slide { position: absolute; inset: 0; transition: opacity 1.4s ease, filter 1.4s ease, transform 7s ease; opacity: 0; filter: blur(28px); transform: scale(1.06); }
    .slide.on { opacity: 1; filter: blur(0); transform: scale(1); z-index: 1; }
    .slide img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .scrim { position: absolute; inset: 0; background: rgba(12,8,6,.38); z-index: 2; }
    .hero-copy { position: absolute; inset: 0; z-index: 3; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 96px 24px 40px; color: #fff; gap: 14px; }
    .hero-copy h1 { margin: 0; font-weight: 800; font-size: clamp(34px, 5vw, 64px); line-height: 1.02; text-transform: uppercase; max-width: 900px; }
    .hero-copy p { margin: 0; font-size: clamp(13px, 1.4vw, 17px); font-weight: 600; letter-spacing: .24em; text-transform: uppercase; }
    .btn-ghost { margin-top: 18px; display: inline-flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 26px; border: 1.5px solid #fff; color: #fff !important; font-size: 14px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .btn-ghost:hover { background: #fff; color: var(--ink) !important; }
    .dots { position: absolute; left: 0; right: 0; bottom: 18px; z-index: 4; display: flex; justify-content: center; gap: 4px; }
    .dots button { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: none; border: 0; cursor: pointer; padding: 0; }
    .dots span { display: block; width: 10px; height: 10px; border-radius: 99px; background: rgba(255,255,255,.55); transition: width .4s ease; }
    .dots button.on span { width: 28px; background: #fff; }

    /* Eser görseli: kırpılmadan, paspartu zeminde */
    .art { position: relative; width: 100%; aspect-ratio: 4 / 5; overflow: hidden; background: var(--matte); transition: transform .5s ease; }
    .art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; padding: 8%; }

    /* Eser ızgarası */
    .catalog { padding: 96px 24px; background: var(--soft); }
    .works-head { margin-bottom: 32px; display: flex; flex-direction: column; gap: 18px; }
    .filter-groups { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
    .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .filters .label { min-width: 72px; font-size: 12px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
    .filters button { min-height: 44px; padding: 0 18px; border-radius: 99px; cursor: pointer; font: inherit; font-size: 14px; font-weight: 600; border: 1.5px solid #c9c6bf; background: transparent; color: var(--ink); }
    .filters button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: #fff; }
    .count { margin: 0 0 24px; font-size: 14px; color: var(--muted); }
    .empty { padding: 48px 0; color: var(--muted); }
    .works { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 40px 28px; }
    .work { display: flex; flex-direction: column; gap: 14px; }
    .work .imgbox { overflow: hidden; width: 100%; box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.06); }
    .work:hover .art { transform: scale(1.025); }
    .work-text { display: flex; flex-direction: column; gap: 4px; }
    .work b { font-family: 'Archivo', sans-serif; font-size: 17px; }
    .work small { font-size: 13px; color: var(--muted); }
    .work .price { font-size: 14px; font-weight: 700; color: var(--accent); }
    .work .sold { font-size: 14px; font-weight: 700; color: var(--muted); }

    /* Sayfa iskeleti (ana sayfa dışı) */
    .page { padding: 56px 24px 112px; }
    .crumb { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; margin-bottom: 28px; min-height: 44px; }

    /* Butonlar */
    .btn { min-height: 52px; padding: 0 28px; border: 1.5px solid var(--ink); background: var(--ink); color: #fff; font: inherit; font-size: 14px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 10px; }
    .btn:hover { background: #000; color: #fff; }
    .btn.secondary { background: transparent; color: var(--ink); }
    .btn.secondary:hover { background: var(--ink); color: #fff; }
    .btn.accent { background: var(--accent); border-color: var(--accent); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .link-btn { background: none; border: 0; padding: 8px 0; font: inherit; font-size: 13px; font-weight: 700; color: var(--muted); text-decoration: underline; cursor: pointer; min-height: 44px; }

    /* Eser sayfası */
    .product { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 56px; align-items: start; }
    .product .art { aspect-ratio: auto; background: var(--soft); padding: 32px; }
    .product .art img { position: static; padding: 0; height: auto; max-height: 76vh; }
    .product-info { display: flex; flex-direction: column; gap: 16px; position: sticky; top: 96px; }
    .product-info h1 { margin: 0; font-size: clamp(32px, 3.6vw, 46px); line-height: 1.05; }
    .product-info .meta { margin: 0; color: var(--muted); }
    .product-info .desc { margin: 0; font-size: 17px; line-height: 1.7; color: #2c2c2c; }
    .product-info .eyebrow { color: var(--accent); }
    .buy { border-top: 1px solid var(--line); padding-top: 20px; display: flex; flex-direction: column; gap: 14px; }
    .buy .big-price { font-family: 'Archivo', sans-serif; font-size: 30px; font-weight: 800; }
    .buy .note { margin: 0; font-size: 14px; color: var(--muted); line-height: 1.6; }
    .buy .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .status-sold { display: inline-block; align-self: flex-start; padding: 6px 12px; background: var(--ink); color: #fff; font-size: 12px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; }
    .related { margin-top: 96px; }
    .related h2 { font-size: 26px; margin: 0 0 24px; }

    /* Formlar (sipariş, bildirim, iletişim) */
    .form { display: flex; flex-direction: column; gap: 16px; }
    .form .row { display: flex; flex-wrap: wrap; gap: 16px; }
    .form .row label { flex: 1 1 200px; }
    .form label { display: flex; flex-direction: column; gap: 8px; font-size: 13px; font-weight: 700; letter-spacing: .04em; }
    .form input, .form textarea { font: inherit; font-size: 15px; min-height: 48px; padding: 12px 14px; border: 1.5px solid #cfccc5; background: #fff; color: var(--ink); }
    .form textarea { resize: vertical; }
    .form input:focus, .form textarea:focus { outline: 2px solid var(--ink); outline-offset: 1px; border-color: var(--ink); }
    .form fieldset { border: 1.5px solid var(--line); padding: 18px; margin: 0; display: flex; flex-direction: column; gap: 14px; }
    .form legend { font-family: 'Archivo', sans-serif; font-weight: 700; padding: 0 6px; }
    .error { margin: 0; color: #b42318; font-weight: 600; }
    .field-error { font-size: 13px; font-weight: 600; letter-spacing: 0; color: #b42318; }
    .form [aria-invalid="true"] { border-color: #b42318; }
    .consent { flex-direction: row; gap: 10px; align-items: flex-start; font-size: 13px; font-weight: 400; letter-spacing: 0; color: var(--muted); line-height: 1.5; }
    .consent input { width: 20px; height: 20px; min-height: 0; margin-top: 1px; flex: none; accent-color: var(--accent); }
    .consent a { color: var(--accent); font-weight: 600; }
    .consent-note { font-size: 12px; color: var(--muted); margin: 0; }
    .prose { max-width: 70ch; display: flex; flex-direction: column; gap: 18px; line-height: 1.7; }
    .prose h2 { font-family: 'Archivo', sans-serif; font-size: 20px; margin: 16px 0 0; }
    .prose p, .prose li { color: var(--ink); }
    .prose ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
    .prose .muted { color: var(--muted); font-size: 14px; }
    .prose .draft { background: var(--soft); border-left: 3px solid var(--accent); padding: 16px 18px; font-size: 14px; }
    .done { background: var(--soft); border-left: 3px solid var(--accent); padding: 20px; }
    .done h2 { margin: 0 0 8px; font-size: 24px; }
    .done p { margin: 0 0 6px; line-height: 1.6; }
    .demo-note { margin: 0; padding: 12px 14px; background: #fff7e6; border: 1px solid #f0d49a; font-size: 13px; line-height: 1.5; }
    .notify { border: 1.5px solid var(--line); padding: 20px; }
    .notify h2 { margin: 0 0 6px; font-size: 20px; }
    .notify > p { margin: 0 0 14px; color: var(--muted); }

    /* Sepet ve sipariş */
    .cart-grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(280px, 1fr); gap: 48px; align-items: start; }
    .cart-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
    .cart-item { display: grid; grid-template-columns: 96px 1fr auto; gap: 18px; align-items: center; padding: 18px 0; border-bottom: 1px solid var(--line); }
    .cart-item .art { aspect-ratio: 1; }
    .cart-item .art img { padding: 6%; }
    .cart-item b { font-family: 'Archivo', sans-serif; font-size: 17px; }
    .cart-item small { display: block; color: var(--muted); margin-top: 4px; }
    .cart-item .price { font-weight: 700; text-align: right; }
    .summary { background: var(--soft); padding: 24px; display: flex; flex-direction: column; gap: 12px; position: sticky; top: 96px; }
    .summary h2 { margin: 0 0 4px; font-size: 20px; }
    .summary .line { display: flex; justify-content: space-between; gap: 12px; font-size: 15px; }
    .summary .total { border-top: 1px solid #d6d2c9; padding-top: 12px; font-weight: 800; font-size: 18px; }
    .summary .note { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }

    /* Sanatçı */
    .two { display: flex; flex-wrap: wrap; gap: 56px; align-items: center; }
    .portrait { flex: 1 1 380px; min-width: 0; }
    .portrait img { width: 100%; height: auto; display: block; }
    .portrait figcaption { margin-top: 10px; font-size: 13px; color: var(--muted); }
    .bio { flex: 1.1 1 400px; min-width: 0; display: flex; flex-direction: column; gap: 22px; }
    .bio p { margin: 0; font-size: 17px; line-height: 1.7; color: #2c2c2c; }
    .bio .caption { font-size: 13px; color: var(--muted); }
    .insta { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; font-weight: 700; align-self: flex-start; }

    /* İletişim */
    .contact { background: #161616; color: #f3f2ef; }
    .contact a { color: #fff; }
    .contact .crumb { color: #fff; }
    .contact .h2 { color: #fff; }
    .contact-info { flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 20px; }
    .contact-info > p { margin: 0; font-size: 17px; line-height: 1.7; color: #cfccc5; }
    .contact-info ul { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 14px; font-size: 15px; }
    .contact-info li { display: flex; gap: 14px; align-items: flex-start; }
    .contact .form { flex: 1.2 1 420px; min-width: 0; }
    .contact .form label { color: #cfccc5; }
    .contact .form input, .contact .form textarea { background: #222; border-color: #3a3a3a; color: #fff; }
    .contact .form input:focus, .contact .form textarea:focus { outline-color: #fff; }
    .contact .btn { background: #fff; color: var(--ink); border-color: #fff; align-self: flex-start; }
    .site-qr { margin-top: 12px; display: flex; align-items: center; gap: 16px; }
    .site-qr .code { background: #fff; padding: 10px; line-height: 0; }
    .site-qr .code img { display: block; width: 132px; height: 132px; image-rendering: pixelated; }
    .site-qr p { margin: 0; font-size: 14px; line-height: 1.6; color: #cfccc5; max-width: 220px; }

    .site-footer { padding: 32px 24px; border-top: 1px solid var(--line); }
    .site-footer .wide { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; font-size: 13px; color: var(--muted); }
    .site-footer b { font-family: 'Bodoni Moda', Georgia, serif; font-weight: 500; font-size: 16px; letter-spacing: .2em; text-transform: uppercase; color: var(--ink); }

    @media (max-width: 520px) { .site-header nav { gap: 4px 16px; } .site-header .wide { padding: 8px 16px; } }
    @media (max-width: 860px) {
      .product, .cart-grid { grid-template-columns: 1fr; gap: 32px; }
      .product-info, .summary { position: static; }
      .product .art { padding: 16px; }
      .buy .actions { grid-template-columns: 1fr; }
      .cart-item { grid-template-columns: 72px 1fr; }
      .cart-item .price { grid-column: 2; text-align: left; }
    }
    @media (prefers-reduced-motion: reduce) { .slide, .art { transition: none; } }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React 18 (UMD) + Babel: kurulum gerektirmez, JSX tarayıcıda derlenir -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
  <!-- QR kod üretici (CDN, kurulumsuz) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>

  <!-- Eser kataloğu ve form kuralları sunucuyla ortak dosyalardan gelir. Modül, Babel betiğinden önce çalışır. -->
  <script type="module">
    import { PRODUCTS } from "./data/products.js";
    import { validateFields } from "./lib/validate.js";
    window.ONT_PRODUCTS = PRODUCTS;
    window.ONT_VALIDATE = validateFields;
  </script>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef, useCallback } = React;

    const CONTACT_EMAIL = "ragipcantok@gmail.com";
    const INSTAGRAM = { url: "https://www.instagram.com/osmantok/", handle: "@osmantok" };
    const SITE_URL = "https://ont-art-gallery.vercel.app/";   // site QR'ı bu adresi açar
    const CART_KEY = "ont-cart";

    // ==== ESERLER — data/products.js'ten (sayfa, sunucu ve mobil aynı listeyi okur) ====
    const PRODUCTS = window.ONT_PRODUCTS;
    // ==========================================

    // ---- Veriden ekran metnine yardımcılar ----
    const STATUS_LABELS = { available: "Satışta", sold: "Satıldı" };
    const formatPrice = price => price == null ? "Fiyat için iletişime geçin" : `${price.toLocaleString("tr-TR")} TL`;
    const tagsOf = p => [p.subject, p.technique].filter(Boolean);
    const metaLine = p => p.medium ? [p.medium, p.size].filter(Boolean).join(" · ") : [p.size, "Teknik bilgisi yakında"].filter(Boolean).join(" · ");
    const byId = id => PRODUCTS.find(p => p.id === id);
    const isBuyable = p => p && p.original.status === "available" && p.original.price != null;
    const ALL = "Tümü";
    const SUBJECTS = [ALL, ...new Set(PRODUCTS.map(p => p.subject))];
    const SIZES = [ALL, ...new Set(PRODUCTS.map(p => p.size).filter(Boolean))];
    const sizeLabel = size => size === ALL ? ALL : size.replace(" cm", "");
    // Sıralama: "Önerilen" katalog sırasıdır; fiyatı belli olmayan eser her iki yönde de sona kalır
    const byPrice = dir => (a, b) => {
      const x = a.original.price, y = b.original.price;
      return x == null || y == null ? (x == null) - (y == null) : dir * (x - y);
    };
    const SORTS = { "Önerilen": null, "Fiyat ↑": byPrice(1), "Fiyat ↓": byPrice(-1) };

    // ---- Yönlendirme: sayfalar adres çubuğundaki # ile ayrılır (GitHub Pages'te sunucu ayarı gerekmez) ----
    const parseRoute = () => {
      const parts = (location.hash.replace(/^#\/?/, "") || "").split("/").filter(Boolean);
      return { page: parts[0] || "", id: parts[1] || null };
    };
    function useRoute() {
      const [route, setRoute] = useState(parseRoute);
      useEffect(() => {
        const onHash = () => { setRoute(parseRoute()); window.scrollTo(0, 0); };
        window.addEventListener("hashchange", onHash);
        return () => window.removeEventListener("hashchange", onHash);
      }, []);
      return route;
    }
    const go = path => { location.hash = path; };

    // ---- Sepet: eser kimlikleri tarayıcıda saklanır (orijinal tek olduğu için her eser en fazla bir kez) ----
    function useCart() {
      const [ids, setIds] = useState(() => {
        try { return (JSON.parse(localStorage.getItem(CART_KEY)) || []).filter(id => isBuyable(byId(id))); } catch (e) { return []; }
      });
      useEffect(() => { try { localStorage.setItem(CART_KEY, JSON.stringify(ids)); } catch (e) {} }, [ids]);
      return {
        ids,
        items: ids.map(byId).filter(Boolean),
        has: id => ids.includes(id),
        add: id => setIds(cur => cur.includes(id) ? cur : [...cur, id]),
        remove: id => setIds(cur => cur.filter(x => x !== id)),
        clear: () => setIds([])
      };
    }

    // ---- Sunucuya form gönderimi: /api/order ve /api/notify ----
    // Webhook adresi ve gizli anahtar yalnızca sunucuda. Fiş (eser adı, fiyat, toplam) orada kurulur; tarayıcı yalnızca form alanlarını ve eser kimliklerini yollar.
    async function postForm(path, body) {
      try {
        const res = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
        const data = await res.json().catch(() => ({}));
        return res.ok ? { ok: true, ...data } : { ok: false, error: data.error ?? "Gönderilemedi.", errors: data.errors ?? {} };
      } catch (err) {
        return { ok: false, error: "Bağlantı kurulamadı.", errors: {} };
      }
    }
    // form.name formun kendi adıdır; alanlar elements üzerinden okunur
    const formValues = (form, names) => Object.fromEntries(names.map(n => [n, form.elements.namedItem(n)?.value ?? ""]));

    // ---- Form doğrulama: kurallar lib/validate.js'te, sunucu da aynılarını uygular ----
    const validateFields = window.ONT_VALIDATE;
    // Hatalı alanı ekran okuyucuya bağlar; hata metni FieldError ile alanın altında çıkar
    const invalidProps = (errors, n) => errors[n] ? { "aria-invalid": true, "aria-describedby": "err-" + n } : {};
    const FieldError = ({ errors, name }) => errors[name] ? <span id={"err-" + name} className="field-error">{errors[name]}</span> : null;
    // Hatalıysa ilk hatalı alana odaklanır ve false döner
    const checkForm = (form, f, setErrors, errors = validateFields(f)) => {
      setErrors(errors);
      const first = Object.keys(errors)[0];
      if (first) form.elements.namedItem(first).focus();
      return !first;
    };
    // Yazmaya başlanan alanın hatası kalkar
    const clearFieldError = setErrors => e => setErrors(cur => {
      if (!cur[e.target.name]) return cur;
      const { [e.target.name]: _, ...rest } = cur;
      return rest;
    });
    // Çift gönderim kilidi: düğme "Gönderiliyor…" olana kadar geçen kısa anda ikinci tıklamayı da durdurur
    function useSubmitLock() {
      const busy = useRef(false);
      return async run => {
        if (busy.current) return;
        busy.current = true;
        try { await run(); } finally { busy.current = false; }
      };
    }
    // KVKK açık rıza kutusu: sipariş ve bildirim formlarında zorunlu; metni Gizlilik sayfasına bağlar

        <input type="checkbox" name="consent" {...invalidProps(errors, "consent")} />
        <span>Kişisel verilerimin sipariş ve iletişim amacıyla işlenmesine ilişkin <a href="#/gizlilik" target="_blank" rel="noopener">Aydınlatma Metni</a>'ni okudum, açık rıza veriyorum.<FieldError errors={errors} name="consent" /></span>

      instagram: <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6" fill="currentColor"/></svg>,

    // ---- Hero: öne çıkan eserler arasında otomatik geçen slayt (dekoratif, kırpılarak gösterilir) ----
    function Hero({ slides, seconds = 5 }) {
      const [current, setCurrent] = useState(0);
      useEffect(() => {
        const timer = setInterval(() => setCurrent(c => (c + 1) % slides.length), seconds * 1000);
        return () => clearInterval(timer);
      }, [current, slides.length, seconds]);
      return (
        <section className="hero">
          {slides.map((src, i) => (
            <div key={src} className={`slide${i === current ? " on" : ""}`}><img src={src} alt="" /></div>
          ))}
          <div className="scrim"></div>
          <div className="hero-copy">
            <span className="eyebrow" style={{ letterSpacing: ".32em", opacity: .92 }}>Osman Nihat Tok</span>
            <h1>ONT Art Gallery</h1>
            <p>Orijinal eserler</p>
            <a className="btn-ghost" href="#eserler" onClick={e => { e.preventDefault(); document.getElementById("eserler").scrollIntoView({ behavior: "smooth" }); }}>Eserleri keşfet {Icon.arrow}</a>
          </div>
          <div className="dots">
            {slides.map((src, i) => (
              <button key={src} className={i === current ? "on" : ""} aria-label={`Görsel ${i + 1}`} onClick={() => setCurrent(i)}><span></span></button>
            ))}
          </div>
        </section>
      );
    }

    // ---- NotifySimilar: satılmış eser için "benzerini haber ver" formu (stock_notify) ----
    function NotifySimilar({ product }) {
      const [status, setStatus] = useState("idle");
      const [errors, setErrors] = useState({});
      const [failure, setFailure] = useState("");
      const lock = useSubmitLock();
      const onSubmit = e => { e.preventDefault(); lock(() => submit(e.target)); };
      const submit = async form => {
        const f = formValues(form, ["name", "email"]);
        const consent = form.elements.consent.checked;
        if (!checkForm(form, { ...f, consent }, setErrors)) return;
        setStatus("sending");
        const r = await postForm("/api/notify", { ...f, consent, productId: product.id });
        if (r.ok) return setStatus("done");
        checkForm(form, { ...f, consent }, setErrors, r.errors);
        setFailure(r.error);
        setStatus("error");
      };
      if (status === "done") return <div className="done" role="status"><p>Teşekkürler. Benzer bir eser geldiğinde size e-postayla haber vereceğiz.</p></div>;
      return (
        <form className="notify form" onSubmit={onSubmit} onInput={clearFieldError(setErrors)} aria-label="Benzerini haber ver formu">
          <h2>Benzerini haber ver</h2>
          <p>Bu eser satıldı. Benzer bir eser geldiğinde size haber verelim.</p>
          <div className="row">
            <label>Ad Soyad<input name="name" autoComplete="name" required {...invalidProps(errors, "name")} /><FieldError errors={errors} name="name" /></label>
            <label>E-posta<input name="email" type="email" autoComplete="email" required {...invalidProps(errors, "email")} /><FieldError errors={errors} name="email" /></label>
          </div>
          <ConsentCheckbox errors={errors} />
          {status === "error" && <p className="error" role="alert">{failure} Sorun sürerse {CONTACT_EMAIL} adresine yazın.</p>}
          <button className="btn" type="submit" disabled={status === "sending"}>{status === "sending" ? "Gönderiliyor…" : "Haber Ver"}</button>
        </form>
      );
    }

    // ---- ProductPage: eserin kendi sayfası (görsel, künye, satın alma, aynı konudan diğer eserler) ----

      const related = PRODUCTS.filter(p => p.subject === product.subject && p.id !== product.id).slice(0, 4);

        <section className="page">
          <div className="wide">
            <a className="crumb" href="#/">{Icon.back} Tüm eserler</a>

                <p className="meta">{metaLine(product)} · Orijinal, tek adet</p>

    // ---- CheckoutPage: teslimat bilgileri + demo ödeme; siparişi /api/order'a gönderir ----
    // Kart alanlarının name özniteliği yoktur ve okunmaz: kart bilgisi hiçbir yere gönderilmez.
    function CheckoutPage({ cart }) {
      const [status, setStatus] = useState("idle");
      const [placed, setPlaced] = useState(null);
      const [errors, setErrors] = useState({});
      const [failure, setFailure] = useState("");
      const items = cart.items;
      const total = items.reduce((s, p) => s + p.original.price, 0);

      const lock = useSubmitLock();
      const onSubmit = e => { e.preventDefault(); lock(() => submit(e.target)); };
      const submit = async form => {
        const f = formValues(form, ["name", "phone", "email", "address"]);
        const consent = form.elements.consent.checked;
        if (!checkForm(form, { ...f, consent }, setErrors)) return;
        setStatus("sending");
        const r = await postForm("/api/order", { ...f, consent, items: items.map(p => p.id) });
        if (r.ok) { setPlaced(r.order); cart.clear(); setStatus("done"); window.scrollTo(0, 0); return; }
        checkForm(form, { ...f, consent }, setErrors, r.errors);
        setFailure(r.error);
        setStatus("error");
      };

      if (status === "done") {
        return (
          <section className="page"><div className="wrap" style={{ maxWidth: 720 }}>
            <div className="done" role="status">
              <h2>Siparişiniz alındı</h2>
              <p>{placed.productName} · {formatPrice(placed.total)}</p>
              <p>Sipariş özeti ve kargo bilgisi {placed.email} adresine gönderilecek.</p>
            </div>
            <p style={{ marginTop: 24 }}><a className="btn secondary" href="#/">Eserlere dön</a></p>
          </div></section>
        );
      }
      if (items.length === 0) {
        return <section className="page"><div className="wrap"><h1 className="h2">Sipariş</h1><p className="empty">Sepetiniz boş. <a href="#/" style={{ color: "var(--accent)", fontWeight: 700 }}>Eserlere göz atın</a>.</p></div></section>;
      }

      return (
        <section className="page">
          <div className="wrap">
            <a className="crumb" href="#/sepet">{Icon.back} Sepete dön</a>
            <h1 className="h2" style={{ marginBottom: 32 }}>Sipariş</h1>
            <div className="cart-grid">
              <form className="form" onSubmit={onSubmit} onInput={clearFieldError(setErrors)} aria-label="Sipariş formu">
                <fieldset>
                  <legend>Teslimat bilgileri</legend>
                  <div className="row">
                    <label>Ad Soyad<input name="name" autoComplete="name" required {...invalidProps(errors, "name")} /><FieldError errors={errors} name="name" /></label>
                    <label>Telefon<input name="phone" type="tel" autoComplete="tel" required {...invalidProps(errors, "phone")} /><FieldError errors={errors} name="phone" /></label>
                  </div>
                  <label>E-posta<input name="email" type="email" autoComplete="email" required {...invalidProps(errors, "email")} /><FieldError errors={errors} name="email" /></label>
                  <label>Teslimat adresi<textarea name="address" rows="3" autoComplete="street-address" required {...invalidProps(errors, "address")}></textarea><FieldError errors={errors} name="address" /></label>
                </fieldset>
                <fieldset>
                  <legend>Ödeme</legend>
                  <p className="demo-note"><strong>Demo ödeme.</strong> Kartınızdan para çekilmez ve kart bilgisi hiçbir yere gönderilmez. Gerçek bir kart numarası yazmayın.</p>
                  <label>Kart üzerindeki ad<input autoComplete="off" placeholder="AD SOYAD" /></label>
                  <label>Kart numarası<input inputMode="numeric" autoComplete="off" placeholder="0000 0000 0000 0000" /></label>
                  <div className="row">
                    <label>Son kullanma<input autoComplete="off" placeholder="AA/YY" /></label>
                    <label>CVC<input inputMode="numeric" autoComplete="off" placeholder="000" /></label>
                  </div>
                </fieldset>
                <ConsentCheckbox errors={errors} />
                {status === "error" && <p className="error" role="alert">{failure} Sorun sürerse {CONTACT_EMAIL} adresine yazın.</p>}
                <button className="btn accent" type="submit" disabled={status === "sending"}>{status === "sending" ? "Gönderiliyor…" : `Siparişi Ver · ${formatPrice(total)}`}</button>
              </form>
              <aside className="summary" aria-label="Sipariş özeti">
                <h2>Özet</h2>
                {items.map(p => <div key={p.id} className="line"><span>{p.title}</span><span>{formatPrice(p.original.price)}</span></div>)}
                <div className="line"><span>Kargo</span><span>Onayda bildirilir</span></div>
                <div className="line total"><span>Toplam</span><span>{formatPrice(total)}</span></div>
              </aside>
            </div>
          </div>
        </section>
      );
    }

    // ---- SiteQr: galeriyi telefonda açan QR kod (üretilemezse hiç gösterilmez) ----
    function SiteQr({ url }) {
      const [src, setSrc] = useState(null);
      useEffect(() => {
        try { const qr = qrcode(0, "M"); qr.addData(url); qr.make(); setSrc(qr.createDataURL(4, 0)); } catch (e) { setSrc(null); }
      }, [url]);
      if (!src) return null;
      return (
        <div className="site-qr">
          <div className="code"><img src={src} alt={`Galerinin adresi için QR kod: ${url}`} width="132" height="132" /></div>
          <p>Galeriyi telefonunuzda açmak için kameranızla okutun.</p>
        </div>
      );
    }

        <section className="page"><div className="wrap">
          <a className="crumb" href="#/">{Icon.back} Ana sayfa</a>
          <h1 className="h2" style={{ marginBottom: 24 }}>Gizlilik ve KVKK Aydınlatma Metni</h1>
          <div className="prose">
            <p className="draft"><strong>Taslak.</strong> Bu metin bir hazırlık taslağıdır; site gerçek satışa açılmadan önce bir hukuk danışmanı tarafından gözden geçirilip tamamlanmalıdır. Site şu an tanıtım/ödev amaçlı çalışmaktadır ve gerçek bir ödeme alınmamaktadır.</p>

            <h2>Veri sorumlusu</h2>
            <p>Osman Nihat Tok (ONT Art Gallery). İletişim: <a href={`mailto:${CONTACT_EMAIL}`}>{CONTACT_EMAIL}</a>. <span className="muted">(Açık unvan, adres ve telefon yayın öncesi eklenecektir.)</span></p>

            <h2>İşlenen kişisel veriler</h2>
            <ul>
              <li><strong>Sipariş:</strong> ad soyad, e-posta, telefon, teslimat adresi.</li>
              <li><strong>Benzerini haber ver:</strong> ad soyad, e-posta.</li>
            </ul>
            <p className="muted">Ödeme şu an demodur; kart bilgileri (numara, son kullanma, CVC) hiçbir şekilde toplanmaz, işlenmez ve iletilmez.</p>

            <h2>İşleme amaçları</h2>
            <ul>
              <li>Siparişin alınması, hazırlanması ve Türkiye içi sigortalı kargoyla teslimi,</li>
              <li>Sipariş ve teslimatla ilgili sizinle iletişim kurulması,</li>
              <li>"Benzerini haber ver" talebinde, benzer bir eser geldiğinde size bilgi verilmesi.</li>
            </ul>

            <h2>Hukuki sebep</h2>
            <p>Verileriniz, 6698 sayılı Kanun'un 5. maddesi uyarınca <strong>açık rızanıza</strong> ve sözleşmenin kurulup ifa edilmesi için gerekli olmasına dayanılarak işlenir. Formdaki onay kutusunu işaretlemeniz açık rıza anlamına gelir; rıza vermeden sipariş veya bildirim tamamlanamaz.</p>

            <h2>Aktarım</h2>
            <p>Verileriniz yalnızca siparişinizin teslimi için kargo firmasıyla, teslimat için gerekli olduğu ölçüde paylaşılır. Bunun dışında üçüncü kişilerle paylaşılmaz, yurt dışına aktarılmaz. <span className="muted">(Çalışılan kargo firması yayın öncesi burada belirtilecektir.)</span></p>

            <h2>Saklama süresi</h2>
            <p>Verileriniz işleme amacının gerektirdiği ve ilgili mevzuatın öngördüğü süre boyunca saklanır, sürenin sonunda silinir veya anonim hâle getirilir. <span className="muted">(Kesin süreler yayın öncesi belirlenecektir.)</span></p>

            <h2>Haklarınız</h2>
            <p>6698 sayılı Kanun'un 11. maddesi uyarınca; verilerinizin işlenip işlenmediğini öğrenme, bilgi talep etme, düzeltilmesini, silinmesini veya işlenmesine itiraz etme haklarına sahipsiniz. Başvurularınızı <a href={`mailto:${CONTACT_EMAIL}`}>{CONTACT_EMAIL}</a> adresine iletebilirsiniz.</p>
          </div>
        </div></section>
      );
    }

    function NotFound() {
      return <section className="page"><div className="wrap"><h1 className="h2">Sayfa bulunamadı</h1><p className="empty"><a href="#/" style={{ color: "var(--accent)", fontWeight: 700 }}>Eserlere dön</a></p></div></section>;
    }

    // ---- App: yönlendirme ve sepet ----
    function App() {
      const { page, id } = useRoute();
      const cart = useCart();
      useEffect(() => {
        document.body.classList.toggle("is-home", page === "");
        if (page !== "eser") document.title = "ONT Art Gallery — Osman Nihat Tok";
      }, [page]);

      let view;
      if (page === "") view = <HomePage />;
      else if (page === "eser") view = <ProductPage id={id} cart={cart} />;
      else if (page === "sanatci") view = <ArtistPage />;
      else if (page === "iletisim") view = <ContactPage />;
      else if (page === "sepet") view = <CartPage cart={cart} />;
      else if (page === "siparis") view = <CheckoutPage cart={cart} />;
      else if (page === "hesap") view = <AccountPage />;
      else if (page === "gizlilik") view = <PrivacyPage />;
      else view = <NotFound />;

      return (
        <>
          <Header page={page} cartCount={cart.ids.length} />
          <main>{view}</main>
          <footer className="site-footer">
            <div className="wide">
              <b>ONT Art Gallery</b>
              <span>© {new Date().getFullYear()} Osman Nihat Tok. Tüm eserlerin hakları saklıdır. · <a href="#/gizlilik" style={{ color: "inherit", textDecoration: "underline" }}>Gizlilik ve KVKK</a></span>
            </div>
          </footer>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
